name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [apps/api, services/transcoder, apps/player]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test --if-present

  nginx-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate rendered Nginx HLS configuration
        run: |
          docker run --rm \
            -e STREAM_SIGNING_SECRET=ci-only-test-secret \
            --add-host api:127.0.0.1 \
            --add-host player:127.0.0.1 \
            -v "$PWD/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.27-alpine nginx -t
